[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpolicy-jittor"
version = "0.1.0"
description = "Jittor reproduction of FlowPolicy (AAAI 2025 Oral)"
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
  "jittor==1.3.11.0",
  "numpy>=1.23,<2",
  "zarr>=2.12,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=7,<9",
]
parity = [
  "pytest>=7,<9",
  "torch>=2.0,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

