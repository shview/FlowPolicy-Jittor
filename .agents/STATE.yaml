current:
  task_id: FPJ-033
  title: "Harder MetaWorld task and full-channel limited-budget experiment"
  attempt: 1
  stage: implementation
  status: in_progress
  owner: /root
  last_handoff_id: FPJ032-GATE-01
  next_stage: verification
  role_handoffs:
    implementation: null
    verification: null
    anti_pattern: null
    quality: null
    gate: null
  objective: >-
    Add a harder MetaWorld task, preferably reach-wall-v3 after a multi-variant expert-quality
    gate, then run a reproducible three-seed full-channel limited-budget comparison only after
    local data, smoke, periodic-checkpoint and resume checks pass. Publish a sanitized evidence
    bundle and portable fresh-machine instructions without claiming the paper recipe.
  scope:
    allowed_paths:
      - .gitignore
      - pyproject.toml
      - README.md
      - docs/**
      - scripts/**
      - src/**
      - tests/**
      - evidence/**
      - data/reach-wall-v3.zarr/**
      - outputs/fpj033/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/reach-v3.zarr/**
      - data/button-press-wall-v3.zarr/**
  acceptance:
    - "Probe reach-wall-v3 over at least 10 task variants and record expert success, first-success steps and suitability before collecting formal demonstrations; do not silently substitute another task."
    - "Create and validate deterministic reach-wall-v3 Zarr demonstrations without modifying the two existing formal datasets."
    - "Add periodic trainer checkpoints and a tested CLI resume path before any costly cloud training; retain the documented long-process numerical tolerance instead of claiming bit-exact resume."
    - "Complete a local low-budget train/rollout smoke with explicit failure reporting before the full-channel run."
    - "If cloud execution proceeds, use the full 512/1024/2048 configuration, 3 training seeds and 20 rollout episodes per seed, recording hardware, budget, hashes, losses, latency, memory and every episode."
    - "Publish a sanitized evidence bundle containing summaries/manifests/hashes and episode results but no dataset, checkpoint, secret or private absolute path."
    - "README provides a fresh-machine quick start and portable explicit simulator interpreter commands; a fresh-clone check is recorded."
    - "Any comparison with button-press-wall-v3 uses matched point count, model, seed count and budget, and is labeled full-channel limited-budget rather than the paper result."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

known_gaps:
  - "reach-wall-v3 has only a one-episode preliminary expert probe (first success 159/200); formal data quality and non-ceiling policy behavior are not yet established."
  - "The Alibaba Cloud DSW instance is stopped and its free system-disk retention window is finite; do not start a costly run before local gates, resume support and budget checks pass."
  - "Local WSL CUDA remains unavailable; any full-channel training result must identify the A10/CUDA environment explicitly."
  - "The public repository is source-complete but does not yet contain a sanitized experiment evidence bundle or a verified fresh-machine quick start."
  - "The training CLI does not yet expose periodic checkpoints or resume even though trainer state restore exists."
  - "EMA weights are stored but the loss still uses target_mode='code'; detached EMA is scheduled for FPJ-034, not this task."
  - "The modern MetaWorld/MuJoCo stack is a documented substitute and cannot be claimed pixel-identical to the paper stack."

prohibited_claims:
  - "paper success rate reproduced"
  - "EMA target used in training"
  - "reach-wall-v3 full-channel result completed before all seeds and episode records exist"
  - "full-channel limited-budget result is the paper's 3000-epoch or 37-task result"
  - "public evidence bundle contains raw datasets or checkpoints"
  - "bit-exact save/resume"
