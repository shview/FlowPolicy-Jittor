current:
  task_id: FPJ-034
  title: "Detached EMA target for the paper-described loss"
  attempt: 1
  stage: implementation
  status: ready
  owner: null
  last_handoff_id: FPJ033-GATE-01
  next_stage: verification
  role_handoffs:
    implementation: null
    verification: null
    anti_pattern: null
    quality: null
    gate: null
  objective: >-
    Implement a true detached EMA target policy for the paper-described v_r loss target while
    retaining the released-code target mode as the default and preserving explicit checkpoint,
    resume and resource semantics. Verify gradient isolation and EMA-only updates on a small CPU
    configuration before any later target-mode experiment.
  scope:
    allowed_paths:
      - README.md
      - docs/**
      - scripts/**
      - src/**
      - tests/**
      - outputs/fpj034/**
      - evidence/fpj034/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/reach-v3.zarr/**
      - data/button-press-wall-v3.zarr/**
      - data/reach-wall-v3.zarr/**
      - evidence/fpj033/**
  acceptance:
    - "Add an explicit detached-EMA target mode in which v_r is computed by a target policy that is a separate model/state from the online policy; target_mode='code' remains behaviorally unchanged and stays the default."
    - "Define and test target initialization and update ordering; target parameters receive no optimizer gradient, are excluded from online trainable parameters and change only through the documented EMA update."
    - "Trainer checkpoint save/load validates and restores the online policy, optimizer/scheduler state, EMA target state and update counters; resume is covered, and legacy/incompatible checkpoints are either supported explicitly or rejected clearly rather than silently changing target semantics."
    - "Small CPU configurations cover shape and finite-value behavior, gradient isolation, EMA numerical updates, checkpoint round-trip and continuation; failures report actionable configuration/state mismatches."
    - "Measure the detached-target CPU memory/time overhead on a documented small configuration before considering a full-channel run; no cloud spend or formal target comparison is part of FPJ-034."
    - "Documentation distinguishes released-code target, detached EMA target and stored-but-unused EMA weights, and does not claim paper-faithful reproduction before gate approval."
    - "The exact full pytest baseline passes, with skipped tests reported separately."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

known_gaps:
  - "The current loss uses target_mode='code'; EmaModel state is stored but is not yet a separate target policy used to compute v_r."
  - "A second full policy copy may materially increase memory; FPJ-034 must measure a small CPU configuration before any full-channel proposal."
  - "Long-process CPU resume is state-correct but not universally bit-exact; FPJ-031's measured 1e-2 tolerance remains unless new evidence narrows it."
  - "Local WSL CUDA remains unavailable and the Alibaba Cloud DSW instance is stopped; FPJ-034 does not authorize cloud restart or spend."
  - "FPJ-033 public evidence is gate-approved; FPJ-034 implementation must preserve all tracked and untracked user/project assets."
  - "Evidence-bundle sanitizer/atomicity/schema and experiment --reuse provenance have nonblocking P2 debt from FPJ-033; they are outside FPJ-034 unless separately queued."

prohibited_claims:
  - "paper-faithful detached EMA target completed before verification, anti-pattern, quality and gate all pass"
  - "paper success rate or full paper recipe reproduced"
  - "detached target is equivalent to applying stop_gradient to the online policy"
  - "full-channel target comparison completed"
  - "cloud CUDA result produced by FPJ-034"
  - "bit-exact save/resume in every process history"
