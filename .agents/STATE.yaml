current:
  task_id: FPJ-035
  title: "Released-code versus detached EMA target comparison"
  attempt: 1
  stage: implementation
  status: ready
  owner: null
  last_handoff_id: FPJ034-GATE-01
  next_stage: verification
  role_handoffs:
    implementation: null
    verification: null
    anti_pattern: null
    quality: null
    gate: null
  objective: >-
    Compare released-code and detached-EMA target semantics under an exactly matched local CPU
    dataset, model, seed and update budget. Report training loss, stability, resource cost and
    closed-loop outcomes before deciding whether a later cloud/full-channel comparison is useful.
  scope:
    allowed_paths:
      - README.md
      - docs/**
      - scripts/**
      - src/**
      - tests/**
      - outputs/fpj035/**
      - evidence/fpj035/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/reach-v3.zarr/**
      - data/button-press-wall-v3.zarr/**
      - data/reach-wall-v3.zarr/**
      - evidence/fpj033/**
      - evidence/fpj034/**
  acceptance:
    - "The experiment CLI passes target_mode and EMA settings through training, resume, rollout and summaries while target_mode='code' remains the default."
    - "A preflight proves both arms use the same dataset hash, task, seeds, points, model, optimizer schedule, batch size, epoch/update budget and rollout protocol; only target semantics differ."
    - "Run the matched small-channel CPU comparison for seeds 0, 1 and 2, recording train/validation losses, wall time, per-step time, target/resource metadata and every rollout outcome."
    - "Report aggregate mean and sample standard deviation for both arms without selecting only the best seed, and disclose failures/variance."
    - "Publish a compact evidence/fpj035 bundle with commands, config/data hashes and aggregate/per-seed records, excluding datasets and checkpoints."
    - "Documentation explains what the comparison can and cannot establish; no cloud/full-channel or paper-success claim is made without separate authorization and evidence."
    - "Run one final exact pytest suite at completion, following the user's single-check instruction, and report skipped tests separately."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

known_gaps:
  - "FPJ-034 proves detached target mechanics and small-CPU overhead, not whether it improves closed-loop success."
  - "The current experiment grid does not yet pass target mode/EMA settings through every cell and rollout summary."
  - "Long-process CPU resume is state-correct but not universally bit-exact; FPJ-031's measured 1e-2 tolerance remains unless new evidence narrows it."
  - "Local WSL CUDA remains unavailable and the Alibaba Cloud DSW instance is stopped; FPJ-035 does not authorize cloud restart or spend."
  - "Published FPJ-032/033/034 evidence and all recorded datasets/checkpoints must remain unchanged."
  - "Evidence-bundle sanitizer/atomicity/schema and experiment --reuse provenance have nonblocking P2 debt from FPJ-033; they are outside FPJ-034 unless separately queued."

prohibited_claims:
  - "detached target improves success before the matched comparison is complete"
  - "paper success rate or full paper recipe reproduced"
  - "small-channel CPU target comparison predicts full-channel A10 behavior"
  - "full-channel target comparison completed"
  - "cloud CUDA result produced by FPJ-035"
  - "bit-exact save/resume in every process history"
