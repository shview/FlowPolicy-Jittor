current:
  task_id: FPJ-032
  title: "Cloud GPU feasibility, paper-scale training and defense materials"
  attempt: 1
  stage: verification
  status: ready
  owner: null
  last_handoff_id: FPJ032-IMPL-02
  next_stage: anti_pattern
  role_handoffs:
    implementation: FPJ032-IMPL-02
    verification: null
    anti_pattern: null
    quality: null
    gate: null
  objective: >-
    Configure the user-provided Alibaba Cloud A10 instance, verify real Jittor CUDA,
    real-data training, the full paper channel configuration and headless simulation,
    then run and preserve a three-seed full-channel limited-budget GPU experiment with
    exact commands, hashes, per-episode results and evidence boundaries.
  scope:
    allowed_paths:
      - .gitignore
      - README.md
      - docs/**
      - scripts/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/**
  acceptance:
    - "README, reproduction plan, environment guide, defense guide and queue agree on the tasks, simulator stack, completed work and resume tolerance."
    - "A hardware-compatible CUDA environment is available before any GPU number is claimed (A10 verified on CUDA 12.1; local Blackwell would require a newer toolkit)."
    - "Real Zarr data performs CUDA backward/update and writes a reloadable checkpoint."
    - "The full 512/1024/2048 channel configuration records one measured CUDA feasibility step without calling it paper-scale training."
    - "The isolated Meta-World/MuJoCo environment produces RGB, point clouds and a closed-loop bridge result without a real robot."
    - "Paper-scale runs record their own hardware, config and checkpoint fingerprints."
    - "No paper success rate is claimed from the CPU low-budget grid."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

known_gaps:
  - "The Alibaba Cloud DSW instance was stopped at 2026-11-15 16:23. Its free mounted disk is retained for only 15 days while stopped, so any second-task run must restart it within that window or restore from locally preserved code and evidence."
  - "Local WSL CUDA remains unavailable, but Alibaba Cloud A10/CUDA 12.1 executed real Jittor kernels, 34 real-data updates and one full-channel CUDA update on 2026-11-15. Existing low-budget experiment-table numbers remain CPU-only."
  - "The full 512/1024/2048-channel configuration completed 3 seeds x 30 epochs x 1050 updates on A10 and 3 x 20 closed-loop episodes: all three seeds were 20/20, mean policy latency 3.811 ms and peak monitored memory 10726 MiB. This is a one-task limited-budget result, not the paper recipe."
  - "PyTorch parity is measured for the small test configuration only (170 checks, worst deviation 1.6e-09); it is not a claim about paper-scale models."
  - "EMA weights are tracked and checkpointed but the loss still uses the online model for v_r (target_mode='code', D018); the paper's detached target is not implemented."
  - "The simulator is a documented substitute (metaworld 3.0/mujoco 3.3 vs the paper's 2.0/mujoco-py), so clouds cannot match the paper point by point (D016)."
  - "The formal experiment grid is a low-budget CPU run: 10 epochs, small channels, 10-20 demonstrations; the measured rates (button-press-wall-v3 83.33% +/- 20.82%, reach-v3 11.67% +/- 2.89%) are not the paper's numbers."
  - "A trained long process can drift by up to 5.49e-3 after save/resume; state and schedule restore exactly, but bit-exact trajectory resume is not claimed (D014, FPJ-031)."

prohibited_claims:
  - "paper success rate reproduced"
  - "PyTorch parity completed for paper-scale models"
  - "EMA target used in training"
  - "end-to-end paper-scale training completed"
  - "the one-step full-channel run is paper-scale training"
  - "the low-budget grid is comparable to the paper's evaluation"
  - "the one-task 30-epoch A10 run is the paper's full 3000-epoch recipe"
  - "bit-exact save/resume"
