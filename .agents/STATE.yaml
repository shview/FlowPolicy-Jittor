  - "Long-process CPU resume is state-correct but not universally bit-exact; FPJ-031's measured 1e-2 tolerance remains unless new evidence narrows it."
  - "Local WSL CUDA remains unavailable. FPJ-036 used the authorized A10 instance, captured evidence, removed large trainer checkpoints after hashing and confirmed the instance stopped."
