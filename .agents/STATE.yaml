current:
  task_id: FPJ-037
  title: "Three-seed target extension plus evidence consolidation and publication"
  attempt: 2
  stage: gate
  status: done
  owner: null
  last_handoff_id: FPJ037-GATE-01
  next_stage: next_task
  role_handoffs:
    implementation: FPJ037-IMPL-02
    verification: FPJ037-VERIFY-01
    anti_pattern: FPJ037-AP-01
    quality: FPJ037-QUALITY-01
    gate: null
  objective: >-
    Extend the gate-approved FPJ-036 full-channel A10 comparison with matched seeds 1/2 while
    consolidating the existing FPJ-032 through FPJ-036 evidence. Preserve seed 0 and all published
    bundles byte-for-byte, publish a clear evidence index and local verifier, and publish new cloud
    values only after the cells and independent validation are complete.
  scope:
    allowed_paths:
      - README.md
      - .gitattributes
      - docs/**
      - scripts/**
      - tests/**
      - evidence/README.md
      - evidence/fpj037/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/reach-v3.zarr/**
      - data/button-press-wall-v3.zarr/**
      - data/reach-wall-v3.zarr/**
      - evidence/fpj033/**
      - evidence/fpj034/**
      - evidence/fpj035/**
      - evidence/fpj036/**
  acceptance:
    - "Use the already-authorized A10 instance to run only matched seeds 1/2 for code and detached target modes; preserve seed 0 and every FPJ-032 through FPJ-036 evidence payload byte-for-byte."
    - "Match the FPJ-036 architecture, data hash, training budget and rollout protocol; prune periodic closed checkpoints during training, retain final trainer checkpoints only through hash and EMA evaluation, then remove their large bytes before stopping the instance."
    - "Add repository line-ending rules so JSON/Markdown evidence blobs retain LF and their published SHA256 across Windows and Linux checkouts."
    - "Add a local verifier that checks public manifests/hashes and independently recomputes the core episode counts and reported aggregates for FPJ-033 through FPJ-037."
    - "Add evidence/README.md as the single claim-to-file index, separating CPU small-channel, A10 three-seed task results, CPU target ablation and A10 one-seed target feasibility."
    - "Update README and technical/defence docs so every table matches verified evidence; publish full-channel seeds 1/2 only after both modes complete and the three-seed aggregate is independently recomputed."
    - "Scan the publication candidate for checkpoint/data bytes, private paths/IDs and credentials, and keep every existing evidence directory unchanged."
    - "Run one final full local suite, complete serial review and publish the documentation/validator changes only after gate passes."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

known_gaps:
  - "FPJ-037 full-channel target statistics are complete, but three seeds and 20 episodes per seed remain a limited-budget course result, not a significance claim or the paper's 3000-epoch recipe."
  - "FPJ-035 found detached worse under 710-update small-channel CPU training; it does not predict full-channel A10 behavior."
  - "FPJ-036 remains an immutable one-seed bundle: code 10/20 and detached 6/20 are feasibility observations; any future three-seed result must be published separately under FPJ-037."
  - "Long-process CPU resume is state-correct but not universally bit-exact; FPJ-031's measured 1e-2 tolerance remains unless new evidence narrows it."
  - "Local WSL CUDA remains unavailable. The authorized A10 instance completed FPJ-037, its large checkpoint bytes were removed after verification, and it was confirmed stopped on 2026-11-16."
  - "Published FPJ-032/033/034/035 evidence and all recorded datasets/checkpoints must remain unchanged."
  - "Evidence-bundle sanitizer/atomicity/schema and experiment --reuse provenance have nonblocking P2 debt from FPJ-033; they are outside FPJ-034 unless separately queued."

prohibited_claims:
  - "a statistically significant or general ranking between code and detached targets from the FPJ-037 three-seed result"
  - "paper success rate or full paper recipe reproduced"
  - "code generally or statistically outperforms detached from the single FPJ-036 seed"
  - "filling cloud-dependent defence placeholders with inferred or estimated results"
  - "training wall-time ratio is an algorithmic speed comparison because the arms had different JIT/cache order"
  - "bit-exact save/resume in every process history"
