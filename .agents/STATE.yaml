  - "Evidence-bundle sanitizer/atomicity/schema and experiment --reuse provenance have nonblocking P2 debt from FPJ-033; they are outside FPJ-034 unless separately queued."

prohibited_claims:
  - "one cloud seed establishes a mean or sample standard deviation"
  - "paper success rate or full paper recipe reproduced"
  - "code generally or statistically outperforms detached from the single FPJ-036 seed"
  - "three-seed full-channel target comparison completed"
  - "training wall-time ratio is an algorithmic speed comparison because the arms had different JIT/cache order"
  - "bit-exact save/resume in every process history"
