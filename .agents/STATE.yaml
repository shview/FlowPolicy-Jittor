current:
  task_id: FPJ-036
  title: "A10 full-channel paired target validation"
  attempt: 2
  stage: gate
  status: done
  owner: null
  last_handoff_id: FPJ036-GATE-01
  next_stage: next_task
  role_handoffs:
    implementation: FPJ036-IMPL-02
    verification: FPJ036-VERIFY-02
    anti_pattern: FPJ036-AP-01
    quality: FPJ036-QUAL-01
    gate: null
  objective: >-
    Use the authorized Alibaba Cloud PAI-DSW A10 instance to compare released-code and detached-EMA
    target semantics for one exactly matched full-channel seed. Record CUDA feasibility, training
    and memory cost, losses and all closed-loop outcomes, then stop the instance before deciding
    whether a three-seed cloud extension is justified.
  scope:
    allowed_paths:
      - README.md
      - docs/**
      - scripts/**
      - src/**
      - tests/**
      - outputs/fpj036/**
      - evidence/fpj036/**
      - .agents/STATE.yaml
      - .agents/HANDOFFS.md
      - .agents/QUEUE.md
    forbidden_paths:
      - ../flowpolicy-upstream/**
      - data/reach-v3.zarr/**
      - data/button-press-wall-v3.zarr/**
      - data/reach-wall-v3.zarr/**
      - evidence/fpj033/**
      - evidence/fpj034/**
      - evidence/fpj035/**
  acceptance:
    - "FPJ-035 source, local evidence and the 249-pass baseline are committed and pushed before the cloud checkout is updated."
    - "Record the DSW instance state and remaining free quota before start; use the existing A10 public-resource instance and do not create a paid resource."
    - "Pull the exact publication commit, verify Jittor CUDA and EGL, and prove the cloud reach-wall-v3 data hash matches the declared dataset before training."
    - "Run code and detached arms for seed 0 with identical 512/1024/2048 channels, 1024 points, batch 64, 30 epochs, EMA 0.999 and 20 rollout episodes; only target semantics/role may differ."
    - "Record train/validation losses, wall and per-step time, sampled peak GPU memory, checkpoint/config/data hashes, latency and every rollout outcome for both arms."
    - "Publish a compact evidence/fpj036 bundle without raw datasets, checkpoints, private paths or credentials, and state that one seed is feasibility evidence rather than a mean."
    - "Stop the cloud instance after evidence is copied and confirm its stopped state; do not extend to three cloud seeds without a new cost/result decision."
  required_commands:
    - >-
      wsl.exe -d Ubuntu -- /home/s/.local/share/flowpolicy/miniforge-py310/bin/python
      -m pytest -q

